<text x="345.0" y="712.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">axil_decerr_responder</text>
<text x="345.0" y="724.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">(M1, unmapped addr)</text>
<rect x="510" y="60" width="480" height="690" fill="#e2e8f0" fill-opacity="0.5" stroke="#64748b" stroke-width="1.25" stroke-dasharray="4,3"/>
<text x="520" y="78" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#666666">PER-SLAVE ARBITRATION (one rr_arbiter2 per box)</text>
<rect x="540" y="90" width="420" height="100" rx="8" ry="8" fill="#fde68a" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="136.83333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">S0 write port + S0 read port</text>
<text x="750.0" y="149.83333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">axil_write_slave_port / axil_read_slave_port</text>
<rect x="540" y="220" width="420" height="100" rx="8" ry="8" fill="#fde68a" stroke="#64748b" stroke-width="1.5"/>
<text x="750.0" y="273.3333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">S1 write port + S1 read port</text>
