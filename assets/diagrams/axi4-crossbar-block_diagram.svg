<rect x="159.5" y="215.0" width="111" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="215.0" y="225.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AWADDR / ARADDR</text>
<path d="M 180 190 L 215 190 L 215 125 L 250 125.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="152.5" y="142.5" width="125" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="215.0" y="152.5" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AWVALID / ARVALID</text>
<path d="M 180 630 L 250 600.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="159.5" y="600.0" width="111" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="215.0" y="610.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AWADDR / ARADDR</text>
<path d="M 180 660 L 215 660 L 215 715 L 250 715.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="152.5" y="672.5" width="125" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="215.0" y="682.5" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AWVALID / ARVALID</text>
<path d="M 440 240.0 L 480 240 L 540 140" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="374.21008489144947" y="192.14985851425087" width="251" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="499.71008489144947" y="202.14985851425087" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">sel[2:0] / decerr -&gt; want, per port</text>
<path d="M 440 600.0 L 480 600 L 540 400" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
