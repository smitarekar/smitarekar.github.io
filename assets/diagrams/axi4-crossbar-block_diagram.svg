<rect x="975.0" y="125.0" width="90" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="1020.0" y="135.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AW/W/B, AR/R</text>
<path d="M 960 270.0 L 1080 270.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="975.0" y="255.0" width="90" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="1020.0" y="265.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AW/W/B, AR/R</text>
<path d="M 960 400.0 L 1080 400.0" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="940.0" y="385.0" width="160" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="1020.0" y="395.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">AW/W/B, AR/R (default)</text>
<path d="M 960 400.0 L 1020 440 L 1020 525 L 1080 525.0" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="964.5" y="461.4444872453601" width="111" height="14" fill="#ffffff" fill-opacity="0.85"/>
<text x="1020.0" y="471.4444872453601" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333333" text-anchor="middle">(optional path)</text>
<text x="40" y="775" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">Not drawn to avoid clutter: each master's full AW/W/AR channel (AWVALID, AWADDR, WDATA, ...) actually fans out to all three per-slave ports, not just the one it currently wants -- decode's per-port `want` signal (derived from sel[2:0]) is what gates only the</text>
<text x="40" y="790" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">addressed port into actually driving the slave and asserting ready back to that master; the other two ports stay silent for that request.</text>
<rect x="40" y="820" width="14" height="14" fill="#c7d2fe" stroke="#64748b" stroke-width="1.25"/>
<text x="62" y="831" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Masters -- M0, M1</text>
<rect x="40" y="838" width="14" height="14" fill="#bfdbfe" stroke="#64748b" stroke-width="1.25"/>
<text x="62" y="849" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Address decode -- one-hot slave select, per master per channel</text>
<rect x="40" y="856" width="14" height="14" fill="#fde68a" stroke="#64748b" stroke-width="1.25"/>
<text x="62" y="867" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Per-slave arbitration -- owns exactly one master's transaction at a time</text>
<rect x="40" y="874" width="14" height="14" fill="#99f6e4" stroke="#64748b" stroke-width="1.25"/>
<text x="62" y="885" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">Slaves -- S0/S1 generic RAM models, S2 default RAM or the optional APB bridge</text>
<rect x="40" y="892" width="14" height="14" fill="#fecaca" stroke="#64748b" stroke-width="1.25"/>
<text x="62" y="903" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333333">DECERR responders -- one per master, for addresses that map to nothing</text>
</svg>
