<text x="750.0" y="403.3333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">S2 write port + S2 read port</text>
<rect x="1080" y="90" width="220" height="100" rx="8" ry="8" fill="#99f6e4" stroke="#64748b" stroke-width="1.5"/>
<text x="1190.0" y="130.33333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">S0</text>
<text x="1190.0" y="143.33333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RAM slave model</text>
<text x="1190.0" y="156.33333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">0x0000_0000, 4KB</text>
<rect x="1080" y="220" width="220" height="100" rx="8" ry="8" fill="#99f6e4" stroke="#64748b" stroke-width="1.5"/>
<text x="1190.0" y="260.3333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">S1</text>
<text x="1190.0" y="273.3333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">RAM slave model</text>
<text x="1190.0" y="286.3333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">0x0001_0000, 4KB</text>
<rect x="1080" y="350" width="220" height="100" rx="8" ry="8" fill="#99f6e4" stroke="#64748b" stroke-width="1.5"/>
<text x="1190.0" y="391.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">S2</text>
<text x="1190.0" y="403.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">axil_ram_slave (default)</text>
<text x="1190.0" y="415.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0x0002_0000, 16B</text>
<rect x="1080" y="480" width="220" height="90" rx="8" ry="8" fill="#fde68a" stroke="#64748b" stroke-width="1.5"/>
<text x="1190.0" y="522.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">optional: axil_to_apb_bridge</text>
<text x="1190.0" y="534.0" font-family="Helvetica,Arial,sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">-&gt; apb_uart_top (make bridge)</text>
