<text x="20" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">axi4-crossbar: 2-master, 3-slave AXI4-Lite topology</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666666">one address decode per master per channel; one independent arbiter per slave per channel</text>
