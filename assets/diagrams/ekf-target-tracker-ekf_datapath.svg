<rect x="630" y="270" width="190" height="80" rx="8" ry="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
<text x="725.0" y="313.6666666666667" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">x_pred = F @ x</text>
<rect x="850" y="270" width="190" height="80" rx="8" ry="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
<text x="945.0" y="306.8333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">P_pred = F@P@F^T</text>
<text x="945.0" y="319.8333333333333" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">+ Qn</text>
<rect x="40" y="440" width="2020" height="300" fill="#e2e8f0" fill-opacity="0.5" stroke="#64748b" stroke-width="1.25" stroke-dasharray="4,3"/>
<text x="50" y="458" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" fill="#666666">UPDATE</text>
<rect x="70" y="500" width="220" height="110" rx="8" ry="8" fill="#bfdbfe" stroke="#64748b" stroke-width="1.5"/>
<text x="180.0" y="545.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">CORDIC</text>
<text x="180.0" y="558.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">16 iterations</text>
<text x="180.0" y="571.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(px,py) -&gt; r, bearing</text>
<rect x="330" y="500" width="220" height="110" rx="8" ry="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
<text x="440.0" y="545.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">H Jacobian</text>
<text x="440.0" y="558.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">4 divides,</text>
<text x="440.0" y="571.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">reusing r twice</text>
<rect x="590" y="500" width="220" height="110" rx="8" ry="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
<text x="700.0" y="545.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">innovation y</text>
<text x="700.0" y="558.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">= z - [r,bearing]</text>
<text x="700.0" y="571.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">bearing wrapped</text>
<rect x="850" y="500" width="230" height="110" rx="8" ry="8" fill="#fecaca" stroke="#64748b" stroke-width="1.5"/>
<text x="965.0" y="551.8333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">S = H P_pred H^T + R</text>
<text x="965.0" y="564.8333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">widened to Q15.14</text>
<rect x="1120" y="500" width="230" height="110" rx="8" ry="8" fill="#fecaca" stroke="#64748b" stroke-width="1.5"/>
<text x="1235.0" y="545.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">det(S), floored if 0;</text>
<text x="1235.0" y="558.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Sinv = adjugate/det</text>
<text x="1235.0" y="571.3333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">(Q15.14)</text>
<rect x="1390" y="500" width="220" height="110" rx="8" ry="8" fill="#fde68a" stroke="#64748b" stroke-width="1.5"/>
<text x="1500.0" y="551.8333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">K = P_pred H^T Sinv</text>
<text x="1500.0" y="564.8333333333334" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">back to Q11.14</text>
<rect x="70" y="650" width="320" height="70" rx="8" ry="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
<text x="230.0" y="688.6666666666666" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">x_new = x_pred + K @ y</text>
<rect x="430" y="650" width="480" height="70" rx="8" ry="8" fill="#c7d2fe" stroke="#64748b" stroke-width="1.5"/>
