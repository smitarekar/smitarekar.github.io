<text x="20" y="34" font-family="Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">ekf-target-tracker: predict/update datapath</text>
<text x="20" y="54" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#666666">fixed-point quantization boundaries -- Q11.14 primary, Q15.14 wide for S/det(S)/Sinv</text>
