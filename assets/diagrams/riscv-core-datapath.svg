<text x="20" y="900" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">control_unit's outputs (reg_write, mem_read/write, alu_op, every mux select) are omitted as individual wires above for legibility -- see the Modules table in the README for the full signal list. MACC (custom-0 opcode) runs mac_unit off rs1_data/rs2_data/rd_rdata directly, in parallel with the ALU -- result_src's</text>
<text x="20" y="915" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#444444">unused 2'b11 encoding picks it at the write-back mux.</text>
